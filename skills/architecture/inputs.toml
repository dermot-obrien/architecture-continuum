# SPDX-License-Identifier: Apache-2.0
#
# Where this repository keeps the artefacts the architecture skill authors and checks. The skill
# carries the method, not the layout: no directory below has a default, because a default would
# be whichever repository the skill was written in, wrong everywhere else while looking like a
# feature.
#
# Answer in [suite.architecture] of the repository's .agents/skill-bindings.toml. Paths resolve
# against that file's directory, never the working directory. Each option names the flows that
# read it (flows) and the flows that cannot run without it (required_by); nothing is required of a
# flow you do not use.
#
# Checked by:  node <skills>/architecture/bin/check.mjs [--flow <flow>] [--json]

[inputs]
short_description = "Where the architecture on the continuum lives, kind by kind"
# With nothing bound at all the skill can do nothing, so the check fails.
requires_any = true
# The tables the ten skills this one replaced were answered in. A key missing from
# [suite.architecture] is read from them for one release, with a warning.
legacy_suites = ["aaa-create-platform", "aaa-create-strategy", "aaa-create-capability", "aaa-create-context", "aaa-create-abb", "aaa-create-sbb", "aaa-create-service", "aaa-create-runtime-agent", "aaa-rung", "aaa-continuum"]
flows = ["platform", "strategy", "capability", "context", "abb", "sbb", "service", "runtime-agent", "stage", "check", "specify", "triage", "assess", "report"]

# A flow's former name, which still selects it.
[inputs.flow_aliases]
rung = "stage"

[inputs.options.root]
type = "dir"
flows = ["check"]
required_by = ["check"]
description = """The folder the whole architecture lives in, such as ../docs/architecture: its README.md is the map, and the demand, solution, runtime and decisions folders, the pages and the CSV registers sit under it. The check reads every page and register under it; scaffold creates it."""

[inputs.options.schemes]
type = "file"
flows = ["check"]
description = """The schemes register: which identifier series exist, where each kind's pages live (home) and which CSV lists them (register). Default: <root>/registers/identifier-schemes.csv when it exists."""

[inputs.options.namespaces]
type = "file"
flows = ["check"]
description = """The namespaces register: the catalogues this one cites as ns:ID. Default: <root>/registers/identifier-namespaces.csv when it exists."""

[inputs.options.schemas]
type = "dir"
flows = ["check"]
description = """A folder of the continuum's front matter schemas (envelope.schema.json and one per kind), to validate against a version other than the one this skill carries in references/standards/schemas/v1.1.0."""

[inputs.options.platformDir]
type = "dir"
flows = ["platform", "capability", "context"]
required_by = ["platform", "capability", "context"]
description = """Where platform documents live, one per PL-NNN: created by the platform flow, and read by the capability and context flows for the parent link."""

[inputs.options.outcomeDir]
type = "dir"
flows = ["strategy", "platform"]
required_by = ["strategy"]
description = """Where business outcome folders are created, one per OC-NNN; read by the platform flow for the outcomes it owns."""

[inputs.options.useCaseDir]
type = "dir"
flows = ["strategy"]
required_by = ["strategy"]
description = """Where use case folders are created, one per UC-NNN."""

[inputs.options.capabilityDir]
type = "dir"
flows = ["capability", "context", "abb", "stage"]
required_by = ["capability"]
description = """Where capability folders are created, one per CAP-NNN (or capabilityIdPattern), with the capability model; read by the context and ABB flows for the parent link, and by the stage flow."""

[inputs.options.contextDir]
type = "dir"
flows = ["context", "abb", "service"]
required_by = ["context"]
description = """Where bounded context folders are created, one per BC-NNN; read by the ABB and service flows for the parent link."""

[inputs.options.abbDir]
type = "dir"
flows = ["abb", "sbb", "stage"]
required_by = ["abb"]
description = """Where ABB folders are created, one per ABB-NNN; read by the SBB flow for the ABB it realises, and by the stage flow."""

[inputs.options.sbbDir]
type = "dir"
flows = ["sbb", "service", "stage"]
required_by = ["sbb"]
description = """Where SBB folders are created, one per SBB-NNN; read by the service flow for the SBB it implements, and by the stage flow."""

[inputs.options.serviceDir]
type = "dir"
flows = ["service"]
required_by = ["service"]
description = """Where service documents are created, one per deployable unit."""

[inputs.options.decisionDir]
type = "dir"
flows = ["stage"]
description = """Decision records (DR-NNN or ADR-NNN), searched recursively by the stage flow."""

[inputs.options.considerationDir]
type = "dir"
flows = ["stage"]
description = """Considerations (CN-NNN), searched recursively by the stage flow."""

[inputs.options.patternDir]
type = "dir"
flows = ["stage"]
description = """Architecture patterns and reference architectures, with realises: [CAP-NNN] (or ids matching capabilityIdPattern) in their front matter, searched recursively by the stage flow."""

[inputs.options.localPattern]
type = "str"
flows = ["stage"]
description = """Regex for a model-local box identifier leading a Building Blocks cell, such as 07 in "07 Gateway". Falls back to [model] local_pattern in the same file, then to [0-9]{1,3}."""

[inputs.options.capabilityIdPattern]
type = "str"
flows = ["capability", "context", "abb", "stage"]
description = '''Regex a capability identifier must match in full, for a repository that numbers its capabilities other than CAP-NNN, such as '^CP-\d{3}$'. A capability page without an id in its front matter takes it from its folder name (CP-102-agent-orchestration/index.md), then the first word of its title or H1. Default: '^CAP-\d{3}$'.'''

[inputs.options.agentProfileSchema]
type = "file"
flows = ["runtime-agent"]
description = """The agent profile JSON Schema an authored profile is validated against. Unbound means the profile is written but not schema-checked, and the flow says so rather than skipping quietly."""

[inputs.options.ontologyValidator]
type = "file"
flows = ["runtime-agent"]
description = """The repository's ontology validator, run over each record the runtime-agent flow writes. Unbound means the same: authored, not validated."""

[inputs.options.criteriaUrl]
type = "str"
flows = ["triage", "report"]
description = """The URL prefix where the assessment criteria are published, one page per criterion named by its id in lower case, as generated into docs/assessment-criteria/ by this bundle, such as https://architecture.example.com/docs/assessment-criteria/. The report and triage flows link each criterion identifier (CORE-QA-01) to <prefix>core-qa-01. Unset, criterion identifiers are written as plain text."""

[inputs.options.catalogueUrl]
type = "str"
flows = ["triage", "report"]
description = """The URL prefix of the catalogue that holds this architecture's identified artefacts, such as https://catalogue.example.com/items/. The triage and report flows turn every catalogue identifier in a report or readout (CAP-033, SBB-044, SD-002, AS-003 and the rest) into a link by appending the identifier to this prefix. Unset, identifiers are written as plain text. A requester may also give it when the flow runs, which wins over the binding."""
