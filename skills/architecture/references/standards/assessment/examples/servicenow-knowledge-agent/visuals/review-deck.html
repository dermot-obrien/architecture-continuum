<p style="font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:#B83A5C">How much scrutiny, and why</p>
<h2 style="font-size:60px;font-weight:700;line-height:1.15;color:#1A1A2E">The assistant fits our target; where its knowledge comes from does not</h2>
</div>
<table style="font-family:'Carlito', Arial, sans-serif;font-size:26px;color:#2C3038">
<tr style="background:#E7E8EE"><th style="width:50%">Part of the design</th><th style="width:50%">Where it stands in our target architecture</th></tr>
<tr><td>The assistant, Copilot Studio, Teams, Entra ID sign-in</td><td>Where we are heading</td></tr>
<tr><td>The Power Platform environment it runs in</td><td>Where we are heading, only for running Copilot Studio agents</td></tr>

<p style="font-size:30px;line-height:1.4;color:#4A4F5C">This design would be a new use, so it needs an exception approved through escalation, or a move to the enterprise knowledge store our target keeps for knowledge from outside Microsoft.</p>
<p style="position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#6B7080">A standard review, 2 of 4. Target positions given by Dermot O'Brien, responsible architect</p>
<p style="position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#6B7080">2 / 12</p>

</section>
</div></div>
<figcaption><span class="num">2 / 12</span><span class="notes">TR-006, tier AT2, type ai-solution. Drivers: reach read and agency none AT2, data AT2, untrusted content AT2, novelty AT2, exposure AT1, effect on people AT1, reversibility AT1. Positions: servicenowkb3 contained (re-attested from not-target), successor the enterprise knowledge store using vector and graph retrieval; graph-index target, permitted use Microsoft 365 content only, so this use is beyond it; Copilot Studio (SBB-044), Teams and Entra ID target; the Power Platform environment (DN-009) target, limited to running Copilot Studio agents. Teams, Entra ID and the index have no catalogue entry: conditions, not novelty. Plan: review, one independent assessor who is a person, approved by the architecture lead, reassessed yearly.</span></figcaption>
</figure>

<p style="font-size:32px;line-height:1.4;color:#2C3038">The 29 that are incomplete or missing are 1 that stops the design, 22 important gaps and 6 minor ones.</p>

</figure>
<figure class="slide" id="theme-target">
<div class="frame"><div class="canvas">
<section id="theme-target" data-transition="fade" style="background:#F7F7F9;color:#2C3038;font-family:'Carlito', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:#C2303A">Risk 1 of 5 · stops the design</p>
<h2 style="font-size:60px;font-weight:700;line-height:1.15;color:#1A1A2E">Its knowledge comes from outside our target state</h2>
</div>
<p style="font-size:34px;line-height:1.4;color:#2C3038">The design copies ServiceNow articles into the Microsoft Graph index, through a connection our target keeps only for the uses it has today. The index is for Microsoft 365 content; outside knowledge belongs in the enterprise knowledge store.</p>
<ul style="font-size:30px;line-height:1.45;color:#4A4F5C">
<li>Neither step away from the target is recorded, and no exception has been sought</li>
<li>The design never considers the enterprise knowledge store</li>
</ul>
<p style="font-size:32px;font-weight:700;color:#1A1A2E">The fix: ground the assistant on the enterprise knowledge store</p>
<p style="position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#6B7080">The only other route is an exception, escalated to and approved by the exception authority</p>
<p style="position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#6B7080">5 / 12</p>

</section>
</div></div>
<figcaption><span class="num">5 / 12</span><span class="notes">Blocker CORE-TGT-05 (F-012): a new use of servicenowkb3, now attested contained (TR-006), with no exception approved through escalation; AS-005 recorded it against the earlier not-target position, and the finding holds under either. Majors CORE-TGT-01 (F-008: two departures with no decisions), CORE-TGT-02 (F-009), CORE-TGT-03 (F-010: the knowledge store not considered). Minors CORE-TGT-04 (F-011), CORE-EVO-02 (F-048).</span></figcaption>
</figure>
<figure class="slide" id="theme-evals">
<div class="frame"><div class="canvas">
<section id="theme-evals" data-transition="fade" style="background:#F7F7F9;color:#2C3038;font-family:'Carlito', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:#B83A5C">Risk 2 of 5</p>
<h2 style="font-size:60px;font-weight:700;line-height:1.15;color:#1A1A2E">Wrong answers aren't yet shown to be rare</h2>
</div>
<p style="font-size:34px;line-height:1.4;color:#2C3038">A wrong answer with a convincing link to an article is the costliest mistake this assistant can make.</p>
<ul style="font-size:30px;line-height:1.45;color:#4A4F5C">
<li>Microsoft can change the AI model without a release, and nothing reruns the tests when it does</li>
<li>The automated marker of correct answers isn't checked against people</li>
<li>No test tries to trick it through text planted in an article</li>
<li>The limit of 2 per cent wrong answers is worked out three different ways</li>
<li>The citation test doesn't say what its mistakes cost</li>
</ul>
<p style="position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#6B7080">What works: the tests already cost wrong answers and refusals separately</p>
<p style="position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#6B7080">6 / 12</p>

</section>
</div></div>
<figcaption><span class="num">6 / 12</span><span class="notes">Majors: AIS-MOD-01 (F-054, model unpinned, no decision accepting the platform-managed model), AIS-EVAL-03 (F-059, no injection test through articles), AIS-EVAL-04 (F-060, judge uncalibrated), AIS-EVAL-06 (F-062, the 2 per cent ceiling has three bases across q1, q2 and EVAL-01; EVAL-03 errors have no cost). Minor: AIS-EVAL-09 (F-065, sample size).</span></figcaption>
</figure>
<figure class="slide" id="theme-permission">
<div class="frame"><div class="canvas">
<section id="theme-permission" data-transition="fade" style="background:#F7F7F9;color:#2C3038;font-family:'Carlito', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:#B83A5C">Risk 3 of 5</p>
<h2 style="font-size:60px;font-weight:700;line-height:1.15;color:#1A1A2E">Permissions aren't yet shown to survive the copy</h2>
</div>
<ul style="font-size:30px;line-height:1.45;color:#4A4F5C">
<li>No security threat analysis for this version</li>
<li>The connection's own identity towards Entra ID isn't stated</li>
<li>Staff are matched to ServiceNow by email: a wrong match gives the wrong access</li>
<li>Text anyone can edit isn't marked where it enters</li>
<li>No plan to have the assistant attacked on purpose before release</li>
<li>The monitoring data that holds staff questions isn't named or protected</li>
</ul>
<p style="font-size:30px;line-height:1.4;color:#17803D;font-weight:700">What works: it fetches articles as the person asking, and a zero-leak test must pass before release</p>
<p style="position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#6B7080">The security and privacy teams test the built system; their results are needed before go-live</p>
<p style="position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#6B7080">7 / 12</p>

</section>
</div></div>
<figcaption><span class="num">7 / 12</span><span class="notes">Majors: CORE-INT-01 (F-030, no interface names a contract), CORE-DAT-01 (F-033, telemetry and audit records not named as data sets), CORE-SEC-03 (F-038, untrusted content not stated on six interfaces), CORE-SEC-04 (F-039, no threat model), CORE-SEC-05 (F-040, IF-07 with no authentication or authorisation, and the email identity mapping), AIS-EVAL-05 (F-061, no red-team plan). Hand-overs: cybersecurity, privacy.</span></figcaption>
</figure>
<figure class="slide" id="theme-platform">
<div class="frame"><div class="canvas">
<section id="theme-platform" data-transition="fade" style="background:#F7F7F9;color:#2C3038;font-family:'Carlito', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:#B83A5C">Risk 4 of 5</p>
<h2 style="font-size:60px;font-weight:700;line-height:1.15;color:#1A1A2E">Its value and cost are asserted, not shown</h2>
</div>
<ul style="font-size:30px;line-height:1.45;color:#4A4F5C">
<li>A 600 US dollar monthly cap, but no cost model behind it</li>
<li>No comparison with simply bringing portal search into Teams</li>
<li>No decision on the platform's limits on how long and how often it calls the AI model</li>
<li>Monitoring isn't shown to capture the cost of each answer</li>
</ul>
<p style="position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#6B7080">If ignored: the service costs more than planned, or stops part-way through a month</p>
<p style="position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#6B7080">8 / 12</p>

</section>
</div></div>
<figcaption><span class="num">8 / 12</span><span class="notes">Majors: CORE-CST-01 (F-045, no cost model), AIS-FIT-01 (F-052, no comparison with improving search), AIS-OPS-01 (F-073, no decision accepting the platform's limits). Minor: AIS-OPS-02 (F-074).</span></figcaption>
</figure>
<figure class="slide" id="theme-change">
<div class="frame"><div class="canvas">
<section id="theme-change" data-transition="fade" style="background:#F7F7F9;color:#2C3038;font-family:'Carlito', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:#B83A5C">Risk 5 of 5</p>
<h2 style="font-size:60px;font-weight:700;line-height:1.15;color:#1A1A2E">Change and failure aren't fully designed</h2>
</div>
<ul style="font-size:30px;line-height:1.45;color:#4A4F5C">
<li>The flow that copies articles into the index serves no named use</li>
<li>Only one failure is described; the platform, the AI model and search going down are not</li>
<li>Nothing describes what it costs to run or how easily it can change</li>
<li>A permission change can take a day to reach the assistant, and no decision accepts that</li>
<li>Three open questions aren't listed, among them whether sign-in returns the articles at all</li>
</ul>
<p style="position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#6B7080">If ignored: outages and permission changes are handled as they happen, not as designed</p>
<p style="position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#6B7080">9 / 12</p>

</section>
</div></div>
<figcaption><span class="num">9 / 12</span><span class="notes">Majors: CORE-TRC-04 (F-007, scenario s2 names no use case), CORE-QA-02 (F-021, no cost or maintainability scenario), CORE-QA-04 (F-023, one failure scenario only), CORE-QA-05 (F-024, the permission lag is a trade-off with no decision), CORE-DEC-02 (F-026, three open questions not listed as considerations, including DEC-03's own check that Graph connector results return under Authenticate with Microsoft).</span></figcaption>
</figure>
