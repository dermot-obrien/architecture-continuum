bindingsVersion = "1.0"

# A small, neutral workspace for the stage tests: an order-handling business with one
# capability at each definition stage, one blocked by an open question, one that lost its
# stage, one with flows at different stages, and one named only by a pattern.

[suite.architecture]
capabilityDir    = "capabilities"
abbDir           = "building-blocks/abbs"
sbbDir           = "building-blocks/sbbs"
decisionDir      = "decisions"
considerationDir = "considerations"
patternDir       = "patterns"
