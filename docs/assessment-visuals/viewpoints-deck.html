<figcaption><span class="num">2 / 7</span><span class="notes">Triage is the front door: a few questions about reach, agency, data, exposure, untrusted content, effect on people, novelty and reversibility give a tier, the highest any one driver gives. The tier then fixes how the gates below are run. Architecture authors the artefacts up to R4; R5 and R6 rest on implementation evidence that architecture receives.</span></figcaption>
</figure>

<p style="font-size:44px;font-weight:700;line-height:1.2;color:#1A1A2E">The assessment reads what you wrote, and only that.</p>
<p style="font-size:28px;line-height:1.35">A quality the design meets but does not state counts as a quality it does not meet.</p>
<div style="display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border-left:6px solid #C2303A;padding:20px 24px;border-radius:4px">
<h3 style="font-size:28px;font-weight:700;color:#1A1A2E">Core blockers to clear first</h3>
<ul style="font-size:24px;line-height:1.4">
<li>Goals, non-goals and stakeholders with concerns</li>
<li>Every reference resolves</li>
<li>Quality scenarios with a measure</li>
<li>Every trust-boundary crossing authenticated</li>
<li>Nothing outside the target state without an approved exception</li>
</ul>
</div>

<h3 style="font-size:30px;font-weight:700;color:#1A1A2E">Ask for triage</h3>
<p style="font-size:24px;line-height:1.35">The tier sets the depth, evidence and approver.</p>

<div style="display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:1px solid #BFC5CC;border-radius:8px;padding:24px">

<p style="font-size:24px;line-height:1.35">Validate, then walk the 53 tool criteria.</p>

<p style="font-size:24px;line-height:1.35">One open blocker means not endorsed.</p>

<figcaption><span class="num">3 / 7</span><span class="notes">Common gaps reviewers find: "fast" with no number; no failure scenario for a dependency the team does not control; a trust-boundary connector with no authentication; decisions without alternatives; open questions left in prose; evidence from an earlier version. The core lens also asks about target state (CORE-TGT-01 to 05): nothing retired used, every departure recorded as a decision, and anything not-target, or a new use of something contained, only under an exception approved through escalation. A design written from the pattern skill's solution design template is translated into a specification table by table.</span></figcaption>
</figure>

<ol style="font-size:26px;line-height:1.5">
<li>Prepare: version and digest</li>
<li>Select the lenses</li>
<li>Check: validate, run tool rules</li>

<li>Evaluate, at evaluation depth</li>
<li>Dispose of every shortfall</li>
<li>Decide the outcome</li>
<li>Record and hand over</li>

<div style="display:flex;flex-direction:column;gap:4px;background:#FFFFFF;border:2px solid #C2303A;border-radius:8px;padding:18px">
<p style="font-size:26px;font-weight:700;color:#1A1A2E">Residual risk</p>
<p style="font-size:24px;line-height:1.3">Owned by someone entitled to accept it</p>
</div>
<div style="display:flex;flex-direction:column;gap:4px;background:#FFFFFF;border:2px solid #C2303A;border-radius:8px;padding:18px">
<p style="font-size:26px;font-weight:700;color:#1A1A2E">AI release gates</p>
<p style="font-size:24px;line-height:1.3">Evals pass; agent controls tested</p>
</div>
</div>
<p style="font-size:24px;color:#5E6B7F"><span style="color:#C2303A"><b>Red border:</b></span> a blocker in the production lens.</p>
</div>
<div style="width:560px;flex:none;display:flex;flex-direction:column;gap:12px">
<h3 style="font-size:30px;font-weight:700;color:#1A1A2E">As built against as designed</h3>
<div style="display:flex;justify-content:space-between;background:#F3E3DC;border-radius:6px;padding:12px 18px"><p style="font-size:24px">Irrelevant, consistent, compliant</p><p style="font-size:24px;font-weight:700;color:#C2303A">Not endorsable</p></div>
<div style="display:flex;justify-content:space-between;background:#DAE9F7;border-radius:6px;padding:12px 18px"><p style="font-size:24px">Conformant</p><p style="font-size:24px;font-weight:700;color:#7A5500">If extras are decisions</p></div>
<div style="display:flex;justify-content:space-between;background:#DAE9F7;border-radius:6px;padding:12px 18px"><p style="font-size:24px;font-weight:700">Fully conformant</p><p style="font-size:24px;font-weight:700;color:#17803D">Endorsable</p></div>
<div style="display:flex;justify-content:space-between;background:#F3E3DC;border-radius:6px;padding:12px 18px"><p style="font-size:24px">Non-conformant</p><p style="font-size:24px;font-weight:700;color:#C2303A">Not endorsable</p></div>
<div style="display:flex;flex-direction:column;gap:8px;background:#F6DBE2;border-radius:8px;padding:20px;flex:1;justify-content:center">
<p style="font-size:26px;font-weight:700;color:#1A1A2E">You approve or decline, by name and date.</p>
<p style="font-size:24px;line-height:1.35">Conditions need an owner and a due date and never sit on a blocker.</p>
</div>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#5E6B7F">Assessment viewpoints · draft Architecture Assessment Standard 0.7.0</p>

</section>
</div></div>
<figcaption><span class="num">5 / 7</span><span class="notes">The production entry assessment is the gate from R5 to R6. It checks that what was built is the design that was assessed, and that it can be run. At AT1 the team runs the production lens's tool criteria and the owner approves; from AT2 it is a review with an independent lead. A solution that departs from its design needs a new, assessed version of the design; a condition does not cover it.</span></figcaption>
</figure>
<figure class="slide" id="specialists">
<div class="frame"><div class="canvas">
<section id="specialists" data-transition="fade" style="background:#F4F5F8;color:#2C3038;font-family:'Carlito', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:32px">
<p style="font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:#B83A5C">Viewpoint 5 · Security, privacy and compliance</p>
<h2 style="font-size:64px;font-weight:700;line-height:1.1;color:#1A1A2E">Where architecture ends and your assessment begins</h2>
<div style="display:flex;gap:12px">
<div style="flex:1;display:flex;flex-direction:column;gap:12px;background:#DBDEEE;border-radius:8px 0 0 8px;padding:28px">
<h3 style="font-size:32px;font-weight:700;color:#1A1A2E">Architecture reads the design</h3>
<ul style="font-size:24px;line-height:1.45">
<li>Trust zones and what crosses them</li>
<li>Authentication on every crossing</li>
<li>The identity each service and agent runs as</li>
<li>Where untrusted content enters</li>
</ul>
</div>
<div style="width:220px;flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#EBE3F5;padding:20px">
<p style="font-size:30px;font-weight:700;color:#1A1A2E;text-align:center">Threat model</p>
<p style="font-size:24px;text-align:center;color:#5E6B7F">the only overlap</p>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:12px;background:#F3E3DC;border-radius:0 8px 8px 0;padding:28px">
<h3 style="font-size:32px;font-weight:700;color:#1A1A2E">You read the running system</h3>
<ul style="font-size:24px;line-height:1.45">
<li>Are controls implemented and effective?</li>
<li>Is the privacy or AI impact acceptable?</li>
<li>Does it conform to the regulation?</li>
<li>Is residual risk accepted by its owner?</li>
</ul>
</div>
</div>
<div style="display:flex;align-items:center;gap:24px">
<div style="flex:1;display:flex;flex-direction:column;gap:6px;background:#FFFFFF;border-left:6px solid #4B5BAA;border-radius:4px;padding:20px 24px">
<p style="font-size:26px;font-weight:700;color:#1A1A2E">At design review</p>
<p style="font-size:24px;line-height:1.35">Your assessment is named and handed over, with the threat model and the findings behind it.</p>
</div>
<x-shape kind="arrow-right" style="width:80px;height:40px;background:#5E6B7F"></x-shape>
<div style="flex:1;display:flex;flex-direction:column;gap:6px;background:#FFFFFF;border-left:6px solid #B83A5C;border-radius:4px;padding:20px 24px">
<p style="font-size:26px;font-weight:700;color:#1A1A2E">At production entry</p>
<p style="font-size:24px;line-height:1.35">Your outcome returns as evidence for the version released. A failed outcome is a blocker.</p>
</div>
</div>
<p style="font-size:28px;line-height:1.35"><b>Not a lens.</b> Your assessment reads a different object, follows its own method, often needs an accredited assessor, and ends in an acceptance only its owner can give.</p>
<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#5E6B7F">Assessment viewpoints · draft Architecture Assessment Standard 0.7.0</p>

</section>
</div></div>
<figcaption><span class="num">6 / 7</span><span class="notes">Methods on the specialist side include NIST SP 800-53A, an ISO/IEC 27001 audit and ISO/IEC 42005. The design-facing part of privacy can be a lens: a privacy-by-design lens, brought in by a personal-data profile, is a candidate.</span></figcaption>
</figure>

<section id="ai" data-transition="fade" style="background:#F4F5F8;color:#2C3038;font-family:'Carlito', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:32px">
<p style="font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:#B83A5C">Viewpoint 6 · AI and agent teams</p>
<h2 style="font-size:64px;font-weight:700;line-height:1.1;color:#1A1A2E">What changes with models and agents</h2>
<div style="display:flex;gap:48px;flex:1">
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
<h3 style="font-size:30px;font-weight:700;color:#1A1A2E">AI solution lens · 28 criteria, 3 blockers</h3>
<ul style="font-size:24px;line-height:1.4">
<li>Evals with a metric and threshold, gating release</li>
<li>Retrieval trimmed to what the caller may see</li>
<li>Output constrained and validated before it acts</li>
<li>False positives and false negatives capped separately by cost, not F1 alone</li>
<li>Abstention tested with questions no source answers</li>
<li>Permission leakage tested with zero tolerance</li>
<li>Enough cases behind every threshold</li>
</ul>
<h3 style="font-size:30px;font-weight:700;color:#1A1A2E">Agent lens · 23 criteria, 9 blockers</h3>
<p style="font-size:24px;line-height:1.4">Every action listed; dangerous ones approved or limited outside the agent; its own identity; a kill switch that works without it.</p>
</div>

<figcaption><span class="num">7 / 7</span><span class="notes">A model is a technology or SBB with an ai facet; an agent is a service that also has an agent facet. The facets bring in the extra lenses, and the core lens still applies. The four new evaluation criteria are AIS-EVAL-06 to 09. At production entry the gating evals must pass on the release candidate, and for an agent a control test must show its limits and kill switch work without its cooperation. The lethal trifecta in a session that runs unattended makes the subject AT4 in triage.</span></figcaption>
