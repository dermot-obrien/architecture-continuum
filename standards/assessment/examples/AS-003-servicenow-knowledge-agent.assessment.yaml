# The design review of SD-002 version 0.1.0 at review depth, against the core (0.3.0) and AI
# solution (0.3.0) lenses, at triage tier AT3 (TR-002). Made by an agent working alone: every
# criterion of both lenses has a result, and every criterion decided by both carries its
# tool_result. The outcome is a proposal; at AT3 an independent lead assessor and a security
# architect, both people, must review these findings before the record is relied on.
# Due dates are proposed by the assessor; the design's owner sets them.
schema: assessment/0.1.0

assessment:
  id: AS-003
  title: Design review of the ServiceNow knowledge agent in Teams
  subject:
    design: SD-002
    version: 0.1.0
    path: SD-002-servicenow-knowledge-agent.design.yaml
    digest: sha256:b6ac13d464b9a6a083466ad0acda63cb0e7dad1bf0c6440c40686ca91b88767c
  trigger: new-design
  triage:
    ref: TR-002
    type: ai-solution
    tier: AT3
    derived_tier: AT3
  depth: review
  lenses:
    - { id: core, version: 0.3.0 }
    - { id: ai-solution, version: 0.3.0 }
  date: "2026-10-28"
  assessors:
    - { name: Architecture agent, role: agent, independent: true }
  out_of_scope:
    - Whether the controls named in the design (permission trimming in servicenowkb3, identity mapping, the integration user's roles, content safety) are implemented and effective; handed over to the cybersecurity assessment.
    - The lawfulness of processing staff personal data in transcripts and telemetry; handed over to the privacy impact assessment.
    - The ServiceNow instance's own security and the Microsoft 365 tenant's configuration beyond what the specification states.
    - The ai-agent lens, which does not apply (no element has an agent facet), and the production lens, which joins only the production entry assessment.
    - The source document named in design.source and the evidence ev-design-research, a claude.ai artifact not available to this assessment.
    - The earlier assessment AS-002, not read by the requester's instruction, so that this assessment stands on its own.
    - Conformance against the target state, left out because the catalogue is not available (the catalogue URL given is a placeholder and the design's catalogue identifiers are illustrative).
  provenance:
    origin: ai-generated
    authored_by: Architecture agent
    review_state: ai-raw
    requires_confirmation_by: An independent lead assessor and a security architect, both people (AT3), before the record is relied on; the architecture board or its delegate, with the service owner, confirms the outcome
    validated_against: assessment.schema.json (assessment/0.1.0) with envelope.schema.json v1.1.0

findings:
  # Core lens 0.3.0
  - id: F-001
    criterion: CORE-DEM-01
    tool_result: met
    result: met
    statement: Two goals, two non-goals and four stakeholders each with concerns. The goals and concerns are specific enough to judge the design against (a cited answer, never an invented one, no article shown to someone ServiceNow would not show it to).
    evidence: [drivers.goals, drivers.non_goals, drivers.stakeholders]
  - id: F-002
    criterion: CORE-DEM-02
    tool_result: met
    result: not-assessed
    statement: >-
      Present: context.outcomes (OC-004), context.serves (UC-031) and context.realises (CAP-033) are non-empty. Not judged: the design does not map each goal to an outcome, and the catalogue entries are illustrative and not available, so whether the second goal (fewer service desk contacts) is OC-004's measure cannot be checked. A person with the catalogue answers it.
    evidence: [context.outcomes, context.serves, context.realises, drivers.goals]
  - id: F-003
    criterion: CORE-DEM-03
    result: partly-met
    type: gap
    severity: minor
    statement: Both constraints cite a source (con-reuse-kb3, con-auth-eval). The only assumption, asm-volume (2,000 questions a working day across 9,000 staff), has no source, and it drives the cost forecast (operations.cost.model) and the peak in sc-latency.
    evidence: [drivers.constraints, drivers.assumptions.asm-volume, operations.cost.model, scenarios.sc-latency]
    recommendation: Give asm-volume a source, such as service desk contact volumes or a pilot's usage.
    disposition: { action: fix-design, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-004
    criterion: CORE-TRC-01
    result: met
    statement: context.realises is CAP-033, context.platform is PL-005 and context.bounded_contexts is BC-012.
    evidence: [context.realises, context.platform, context.bounded_contexts]
  - id: F-005
    criterion: CORE-TRC-02
    result: met
    statement: The in-scope elements, actor and external-system excluded, are technology (teams, entra, graph-index), sbb (sbb-kb-connection, sbb-copilot-studio), deployment-node (node-pp-prod) and service (svc-kb-agent), so the abstraction is physical, which a solution-design must be.
    evidence: [design.type, elements]
  - id: F-006
    criterion: CORE-TRC-03
    result: met
    statement: design.type is solution-design and design.implements is RA-007.
    evidence: [design.type, design.implements]
  - id: F-007
    criterion: CORE-TRC-04
    result: met
    statement: The one functional scenario, sc-answer, has use_case UC-031, and UC-031, the only id in context.serves, appears as its use case.
    evidence: [scenarios.sc-answer.use_case, context.serves]
  - id: F-008
    criterion: CORE-TGT-01
    result: not-met
    type: gap
    severity: major
    elements: [sbb-kb-connection, graph-index, node-pp-prod]
    statement: >-
      Read from TR-002 target_state, as the responsible architect attested it on 2026-10-28. No element is retired. sbb-copilot-studio, teams and entra are target. sbb-kb-connection and graph-index are baseline, and neither is named in the affects of a decision with departure set: d-copilot-connector and d-reuse-kb3 name sbb-kb-connection in affects but set no departure, and no decision names graph-index at all. node-pp-prod (DN-009) has no attested position, so this criterion is not-assessed for it and the missing attestation is a condition. These two blocks carry the design's whole grounding path, which the architect called the more important of the blocks that are not target, and no successor was named.
    evidence: [triage.target_state, decisions.d-copilot-connector, decisions.d-reuse-kb3, elements.node-pp-prod]
    recommendation: Record a decision with departure set (from the target state for Microsoft 365 ingestion and semantic querying, kind time-bound, with expires and path_back) that names sbb-kb-connection and graph-index in its affects; ask the responsible architect for the position of node-pp-prod.
    disposition: { action: record-decision, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-009
    criterion: CORE-TGT-02
    tool_result: met
    result: not-met
    type: gap
    severity: major
    elements: [sbb-kb-connection, graph-index]
    statement: >-
      The tool half is met because no decision sets departure, so there is nothing to check. The reviewer half is not: two departures from the attested target state (sbb-kb-connection and graph-index at baseline, TR-002 target_state) have gone unrecorded. A time-bound departure needs expires and path_back, and with no successor named a path back cannot yet be written, which is why F-010 asks the architect for one.
    evidence: [decisions, triage.target_state]
    recommendation: Record the departure as in F-008, time-bound, with an expiry the owner and the responsible architect agree; fill path_back once a successor is named.
    disposition: { action: record-decision, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-010
    criterion: CORE-TGT-03
    result: partly-met
    type: risk
    severity: major
    elements: [sbb-kb-connection, graph-index, svc-kb-agent]
    statement: >-
      The design moves CAP-033 forward on target blocks for its channel, identity and agent runtime (teams, entra, sbb-copilot-studio, TR-002 target_state), but builds its grounding entirely on two blocks attested as not target (data-kb-index via c-connection-index and c-agent-index), and d-reuse-kb3 makes the agent one more dependant of the shared connection servicenowkb3, which will make that block harder to move off when a successor is named. design.lifecycle_state declares the design target although its grounding path is baseline. Nothing is being retired yet, so no planned retirement is blocked today.
    evidence: [triage.target_state, design.lifecycle_state, elements.svc-kb-agent.ai.grounding.sources, decisions.d-reuse-kb3, connectors.c-agent-index, connectors.c-connection-index]
    recommendation: Ask the responsible architect what the target is for Microsoft 365 ingestion and semantic querying, and whether this design proceeds on the baseline blocks under a time-bound departure or waits; correct design.lifecycle_state to what the attestation supports.
    disposition: { action: raise-consideration, owner: "Dermot O'Brien, responsible architect", due: "2026-11-27" }
    status: open
  - id: F-011
    criterion: CORE-TGT-04
    result: partly-met
    type: gap
    severity: minor
    elements: [sbb-kb-connection, graph-index]
    statement: The rationale of d-copilot-connector argues that the connector route is Microsoft's guidance for knowledge question answering at scale and that the alternatives are preview or need a ServiceNow connection per user. If that holds, the attested target (with no successor) may be incomplete, and the design should ask for the target to change rather than work around it; no consideration asks.
    evidence: [decisions.d-copilot-connector.rationale, decisions.d-copilot-connector.alternatives, considerations, triage.target_state]
    recommendation: Raise a consideration to the responsible architect, with the d-copilot-connector rationale as its argument, asking whether the target for ingestion and semantic querying should change.
    disposition: { action: raise-consideration, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-012
    criterion: CORE-STR-01
    result: partly-met
    type: gap
    severity: minor
    elements: [sbb-copilot-studio]
    statement: >-
      sbb-kb-connection passes the container test (a configured connection with its own crawl schedule and lifecycle). sbb-copilot-studio is named for the whole Copilot Studio product, a platform many solutions share, and is placed part_of BC-012, this design's bounded context; the container here is the agent built on it (svc-kb-agent). Severity moved from major to minor: the grain of SBB-044 is the catalogue's, not this design's, and the design's own blocks are at container grain.
    evidence: [elements.sbb-copilot-studio, elements.svc-kb-agent.realises]
    recommendation: Ask the catalogue owner whether SBB-044 is a container or a platform; if a platform, model it as such and have the service realise an SBB at container grain.
    disposition: { action: raise-consideration, owner: Power Platform team }
    status: open
  - id: F-013
    criterion: CORE-STR-02
    result: met
    statement: sbb-kb-connection, sbb-copilot-studio and svc-kb-agent each have part_of BC-012.
    evidence: [elements.part_of]
  - id: F-014
    criterion: CORE-STR-03
    result: met
    statement: svc-kb-agent realises sbb-copilot-studio, an element of the abstraction above.
    evidence: [elements.svc-kb-agent.realises]
  - id: F-015
    criterion: CORE-STR-04
    result: met
    statement: svc-kb-agent is deployed_to node-pp-prod, a deployment-node; every data set's owner (servicenow, graph-index, svc-kb-agent) resolves to an element.
    evidence: [elements.svc-kb-agent.deployed_to, data.owner]
  - id: F-016
    criterion: CORE-STR-05
    result: not-met
    type: gap
    severity: minor
    statement: >-
      Applied as written. Ids are unique, and every from, to, via, trust_zone, deployed_to, realises, data, grounding source, data owner, affects and fitness-function scenario resolves to an element, connector, trust zone, data set or scenario. But evidence.ev-design-research.covers names d-copilot-connector, d-reuse-kb3 and d-auth-microsoft, which are decision ids, and decisions are not among the kinds the rule lists, so by the rule those three references do not resolve. Severity moved from blocker to minor, with this reason: the ids resolve unambiguously to decisions in the same file, so nothing a reader or a tool follows is dangling, which is the harm the blocker guards against. The rule seems wrong for this case: it omits decisions, evals, considerations, risks and fitness functions, all of which a specification legitimately references, and the criterion's reads list does not include evidence.covers at all. A person who restores the default severity makes the outcome not-endorsed.
    evidence: [evidence.ev-design-research.covers, decisions]
    recommendation: Either point covers at the elements the research speaks to, or change the lens so the rule counts decisions, evals, considerations, risks and fitness functions as resolvable.
    disposition: { action: fix-design, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-017
    criterion: CORE-STR-06
    result: met
    statement: sbb-kb-connection (Microsoft 365 admin), sbb-copilot-studio and node-pp-prod (Power Platform team) and svc-kb-agent (Digital workplace team) each have owner.
    evidence: [elements.owner]
  - id: F-018
    criterion: CORE-STR-07
    result: partly-met
    type: gap
    severity: major
    elements: [svc-kb-agent, graph-index, sbb-kb-connection, teams]
    statement: Dependencies run down to platform services (Teams, the Graph index, Entra), which is the right direction, but context.landscape is not set, so the design's place in the landscape cannot be confirmed, and no connector names a contract, so none runs through one (see F-029).
    evidence: [context, connectors]
    recommendation: Set context.landscape, and name the vendor interface and version each platform dependency runs through (F-029).
    disposition: { action: fix-design, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-019
    criterion: CORE-QA-01
    tool_result: met
    result: met
    statement: Three quality scenarios, one failure and one misuse scenario, each with stimulus, response, a measurable response_measure and importance (for example sc-latency, 95 percent within 10 seconds; sc-restricted, zero leaks in 300 probes).
    evidence: [scenarios]
  - id: F-020
    criterion: CORE-QA-02
    tool_result: partly-met
    result: partly-met
    type: gap
    severity: major
    statement: Reliability (sc-crawl-stops), security (sc-restricted) and performance-efficiency (sc-latency) are covered. No scenario covers maintainability or cost, and neither omission is stated as deliberate, although cost is capped (elements.svc-kb-agent.ai.limits.budget, operations.cost.budget) and the connection's query string and the platform model are named as things that change (elements.svc-kb-agent.ai.drift_monitoring).
    evidence: [scenarios.quality_attribute, operations.cost, elements.svc-kb-agent.ai.drift_monitoring]
    recommendation: Add a cost scenario (for example credit consumption when the unlicensed share or the volume rises, against the 600 USD cap) and a maintainability scenario (a change to the connection's scope or the platform model, with the response the eval rerun gives), or state why each is omitted.
    disposition: { action: fix-design, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-021
    criterion: CORE-QA-03
    tool_result: met
    result: met
    statement: >-
      Every quality, failure and misuse scenario has importance and difficulty. The two high-high scenarios have design responses: sc-correct (eval-correctness, eval-answer-or-abstain, ff-gating-evals) and sc-restricted (caller-permission-trimmed grounding, eval-permission-leakage, ff-leakage).
    evidence: [scenarios.importance, scenarios.difficulty, fitness_functions]
  - id: F-022
    criterion: CORE-QA-04
    tool_result: met
    result: partly-met
    type: gap
    severity: major
    elements: [graph-index, sbb-kb-connection, sbb-copilot-studio, entra]
    statement: >-
      Present: sc-crawl-stops is a failure scenario. Not enough: it is the only one, for a design that depends on five things it does not control. There is none for Copilot Studio or its model being unavailable (elements.svc-kb-agent.ai.fallback says the agent says so, which it cannot do when the platform is down), none for Graph search failing, and none for a failure in the permission path: knowledge base permission changes reach the index only at the daily full crawl, or within 30 minutes with identity sync (elements.svc-kb-agent.ai.grounding.freshness), and identities are mapped by email (data.data-kb-index.lineage), so a revoked or mis-mapped user can read content they should not for up to a day.
    evidence: [scenarios, elements.svc-kb-agent.ai.grounding.freshness, elements.svc-kb-agent.ai.fallback, data.data-kb-index.lineage, operations.recovery.degraded_mode]
    recommendation: Add failure scenarios for platform or model unavailability (with how staff reach the Service Portal search), for Graph search failure, and for permission revocation and identity-mapping failure, with a measure on how long a revoked user can still retrieve an article.
    disposition: { action: fix-design, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-023
    criterion: CORE-QA-05
    result: partly-met
    type: trade-off-point
    severity: major
    elements: [sbb-kb-connection, svc-kb-agent]
    statement: >-
      The answer-or-abstain trade-off is made deliberately in the eval (false positives capped at 2 percent and false negatives at 20 percent, F0.5, elements.svc-kb-agent.ai.evals.eval-answer-or-abstain), and d-reuse-kb3 and d-auth-microsoft record their alternatives. The trade-off between permission freshness and security (a daily full crawl for permission changes against the cost and load of crawling more often, elements.svc-kb-agent.ai.grounding.freshness) is not recorded as a decision, and it is the one the information security stakeholder's concern turns on.
    evidence: [elements.svc-kb-agent.ai.evals.eval-answer-or-abstain, elements.svc-kb-agent.ai.grounding.freshness, decisions, drivers.stakeholders]
    recommendation: Record the crawl and identity-sync schedule as a decision, with the permission latency it accepts and why, and the alternatives (more frequent full crawls, identity sync enabled).
    disposition: { action: record-decision, owner: Microsoft 365 admin, due: "2026-11-27" }
    status: open
  - id: F-024
    criterion: CORE-DEC-01
    tool_result: met
    result: partly-met
    type: risk
    severity: major
    elements: [svc-kb-agent]
    statement: Both accepted decisions have chosen, alternatives and rationale. But d-auth-microsoft is accepted while its rationale says it is still "to confirm in the tenant that Graph connector knowledge is returned under it"; if it is not, the grounding path of the whole design fails, so an accepted decision rests on an unconfirmed premise.
    evidence: [decisions.d-auth-microsoft.status, decisions.d-auth-microsoft.rationale, decisions.d-copilot-connector]
    recommendation: Confirm in the tenant that Graph connector knowledge is returned under Authenticate with Microsoft and cite the result as evidence, or return d-auth-microsoft to proposed until it is confirmed.
    disposition: { action: fix-design, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-025
    criterion: CORE-DEC-02
    result: partly-met
    type: gap
    severity: major
    statement: >-
      Two open questions are named (cn-kb-scope, cn-hr-bases). Three are not: what succeeds the baseline ingestion and semantic querying blocks (TR-002 target_state, no successor named); whether Graph connector knowledge is returned under Authenticate with Microsoft (decisions.d-auth-microsoft.rationale); and how a platform-managed, unpinned model is accepted (elements.svc-kb-agent.ai.model.version_pinned false; F-053).
    evidence: [considerations, triage.target_state, decisions.d-auth-microsoft.rationale, elements.svc-kb-agent.ai.model]
    recommendation: Add the three as considerations, each with its options.
    disposition: { action: raise-consideration, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-026
    criterion: CORE-DEC-03
    result: met
    type: observation
    statement: design.status is proposed, so the rule's condition does not hold and the criterion is met. Both considerations (cn-kb-scope, cn-hr-bases) are open and must be resolved by accepted decisions before the design can be accepted.
    evidence: [design.status, considerations.status]
  - id: F-027
    criterion: CORE-DEC-04
    tool_result: met
    result: met
    statement: Both accepted decisions state reversibility, two-way-door, and nothing in the design is a one-way door; the connection, the authentication choice and the channel can each be changed without rebuilding the rest.
    evidence: [decisions.reversibility]
  - id: F-028
    criterion: CORE-DEC-05
    result: not-met
    type: gap
    severity: minor
    elements: [sbb-kb-connection, graph-index]
    statement: Building the grounding on two blocks attested as not target (TR-002 target_state) is debt taken on knowingly once the attestation is known, and no decision records technical_debt.
    evidence: [decisions.technical_debt, triage.target_state]
    recommendation: Once the departure decision of F-008 is recorded, raise a technical debt item for moving the grounding to the successor and attach it to that decision.
    disposition: { action: accept-as-debt, owner: Digital workplace team }
    status: open
  - id: F-029
    criterion: CORE-INT-01
    result: not-met
    type: gap
    severity: major
    statement: Every one of the six connectors crosses the design's boundary (each has an actor, an external-system or a technology at an end), and none has contract. Each runs over a vendor's published interface (Microsoft Graph search, Microsoft Graph external items, the ServiceNow REST table API and the Microsoft Copilot scripted REST API, the Teams and Microsoft 365 channel) whose name and version should be the contract.
    evidence: [connectors.contract, connectors.protocol]
    recommendation: Give each connector a contract naming the channel or the vendor's published interface and its version.
    disposition: { action: fix-design, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-030
    criterion: CORE-INT-02
    tool_result: met
    result: met
    statement: No connector has both ends with part_of set to different contexts (only sbb-kb-connection, sbb-copilot-studio and svc-kb-agent have part_of, all BC-012, and no connector joins two of them), so no context relationship is required; the boundary-crossing connectors are judged by CORE-INT-01.
    evidence: [connectors, elements.part_of]
  - id: F-031
    criterion: CORE-INT-03
    result: met
    type: sensitivity-point
    elements: [sbb-kb-connection]
    statement: >-
      The agent's coupling to the shared connection servicenowkb3 is deliberate (d-reuse-kb3, alternatives recorded) and its consequence is watched (gating evals rerun after any change to the connection's query string, elements.svc-kb-agent.ai.drift_monitoring). It is a sensitivity point: what the agent can answer turns on a query string another team owns for other consumers (cn-kb-scope).
    evidence: [decisions.d-reuse-kb3, elements.svc-kb-agent.ai.drift_monitoring, considerations.cn-kb-scope]
    recommendation: Settle cn-kb-scope and d-reuse-kb3 before acceptance, and have the Microsoft 365 admin notify the agent's owner of any change to the connection.
  - id: F-032
    criterion: CORE-DAT-01
    tool_result: met
    result: partly-met
    type: gap
    severity: major
    statement: >-
      The three data sets have owner and classification. Significant data sets are missing: the telemetry Copilot Studio sends to Application Insights (operations.observability.conventions), which can hold staff questions and answers; the audit records under Purview retention (data.data-transcripts.retention); the identity mapping from ServiceNow users to Entra identities by email (data.data-kb-index.lineage), on which permission trimming depends; and the eval datasets, including the restricted test articles with canary phrases and the test users (elements.svc-kb-agent.ai.evals).
    evidence: [data, operations.observability.conventions, data.data-transcripts.retention, data.data-kb-index.lineage, elements.svc-kb-agent.ai.evals]
    recommendation: Add each as a data set with owner, classification, personal, residency, retention and lineage.
    disposition: { action: fix-design, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-033
    criterion: CORE-DAT-02
    result: met
    statement: data-kb-articles, data-kb-index and data-transcripts (confidential, the last also personal) each have residency, retention and lineage.
    evidence: [data.residency, data.retention, data.lineage]
  - id: F-034
    criterion: CORE-DAT-03
    result: met
    statement: Each data set has one owner. The only writer other than an owner, sbb-kb-connection, writes data-kb-index through the owner's interface (c-connection-index, Microsoft Graph external items, writing only to servicenowkb3); data-kb-articles is only read.
    evidence: [data.owner, connectors.c-connection-index, connectors.c-connection-servicenow]
  - id: F-035
    criterion: CORE-SEC-01
    result: met
    statement: Three trust zones are declared, and every element other than the actor staff has trust_zone.
    evidence: [trust_zones, elements.trust_zone]
  - id: F-036
    criterion: CORE-SEC-02
    result: met
    statement: The connectors whose ends lie in different zones (c-teams-agent, c-agent-index, c-connection-servicenow) and those from the actor (c-staff-teams, c-staff-portal) all state authentication and authorisation other than none.
    evidence: [connectors.authentication, connectors.authorisation, elements.trust_zone]
  - id: F-037
    criterion: CORE-SEC-03
    tool_result: not-met
    result: not-met
    type: gap
    severity: major
    statement: >-
      Three connectors have an actor or an external-system at an end and do not state carries_untrusted_content: c-staff-teams and c-staff-portal (staff) and c-connection-servicenow (servicenow). c-connection-servicenow pulls the same contributor-written article text that c-agent-index flags as untrusted, so the untrusted path is marked only at its last hop. The user's question is untrusted model input too (elements.svc-kb-agent.ai.input_trust mixed), and c-teams-agent, which carries it to the agent, does not say so, although the rule does not require it there.
    evidence: [connectors.c-staff-teams, connectors.c-staff-portal, connectors.c-connection-servicenow, connectors.c-agent-index.carries_untrusted_content, connectors.c-teams-agent]
    recommendation: State carries_untrusted_content on every connector, true on c-connection-servicenow, c-connection-index, c-staff-teams and c-teams-agent, and name where the content is validated.
    disposition: { action: fix-design, owner: Digital workplace team, due: "2026-11-27" }
    status: open
  - id: F-038
    criterion: CORE-SEC-04
    result: not-met
    type: gap
    severity: major
    statement: evidence has no entry of type threat-model; its only entry, ev-design-research, is of type other. The design is proposed, so a security assessment is not yet required; this assessment records the hand-over to cybersecurity.
    evidence: [evidence]
    recommendation: Produce a threat model for version 0.1.0, covering the permission path (ACL build, identity mapping, crawl latency), indirect prompt injection through article text, and link rendering in Teams, and cite it as evidence.
