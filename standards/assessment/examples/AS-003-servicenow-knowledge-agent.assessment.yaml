risk_themes:
  - id: rt-grounding-not-target
    statement: The design's grounding path (the servicenowkb3 connection and the Graph semantic index) is attested as not target with no successor named, and the design neither records the departure nor isolates the path so it can be replaced.
    findings: [F-008, F-009, F-010, F-011, F-025, F-028, F-047]
    threatens: [CAP-033, "Goal: staff get a correct, cited answer from a published ServiceNow knowledge article in Teams"]
  - id: rt-permission-and-untrusted-content
    statement: Whether an article reaches only people ServiceNow would show it to, and whether contributor-written article text can steer the model, rests on a permission path (ACL build, email identity mapping, a daily permission crawl) and an untrusted-content path that have no threat model, no failure scenario and no injection or red-team eval yet.
    findings: [F-022, F-023, F-032, F-037, F-038, F-039, F-058, F-060]
    threatens: ["Stakeholder concern: no article shown to someone ServiceNow would not show it to, HR content above all", "Goal: staff get a correct, cited answer from a published ServiceNow knowledge article in Teams"]
  - id: rt-eval-evidence
    statement: The evals are well framed, but the correctness judge is uncalibrated, the abstention error mixes two errors, the samples cannot always tell a pass from chance, and an unpinned platform model can change behaviour without the evals being rerun.
    findings: [F-053, F-059, F-061, F-062, F-064]
    threatens: [OC-004, "Goal: staff get a correct, cited answer from a published ServiceNow knowledge article in Teams"]
  - id: rt-platform-cost-operability
    statement: The design rests on vendor interfaces with no named contracts, an authentication choice whose premise is unconfirmed, platform limits nobody has recorded accepting, and a cost cap with no cost model, so the saving it promises and the bounds it relies on are not yet shown.
    findings: [F-018, F-020, F-024, F-029, F-044, F-051, F-072, F-073, F-074]
    threatens: [OC-004, "Goal: fewer service desk contacts for questions an article already answers"]

handovers:
  - to: cybersecurity
    scope: >-
      A full security assessment (AT3) of the permission path and the untrusted-content path: how servicenowkb3 builds read ACLs from knowledge base and article user criteria, the email-based identity mapping, permission latency at the daily crawl, the integration user's custom read and HR content reader roles, the delegated ExternalItem.Read.All scope, indirect prompt injection through article text and link rendering in Teams. Whether these controls are implemented and effective is its question, not this assessment's.
    findings: [F-022, F-037, F-038, F-039, F-060]
  - to: privacy
    scope: >-
      A privacy impact assessment of staff personal data in transcripts (30 days in Dataverse, audit records under Purview), in Application Insights telemetry and in any eval datasets drawn from staff questions, with the lawful basis under GDPR as employer.
    findings: [F-032, F-068]

verdict:
  outcome: endorsed-with-conditions
  summary: >-
    Proposed by an agent, for a person to confirm. SD-002 0.1.0 is a sound read-only AI solution: retrieval is permission-trimmed by the index rather than the prompt, abstention and leakage have gating evals with costed error ceilings, and every blocker criterion of both lenses is met. It is triaged at AT3, not TR-001's AT2, because four building blocks have no catalogue ref and no platform is shown as assessed. No blocker is open. Twenty-two majors are open; thirteen are design fixes and nine go to decisions or considerations. The outcome rests on three things: the grounding path is attested as not target with no successor and no departure recorded; there is no threat model, cost model, red-team plan or calibrated judge yet; and the due dates on every design fix are the assessor's proposals, so if the owner does not set them the outcome becomes not-endorsed. CORE-STR-05 is not met as its rule is written and was moved from blocker to minor with a reason; restoring the default also makes the outcome not-endorsed. Conformance against the target state is left out because the catalogue is not available.
  conditions:
    - Record the departure from the target state for sbb-kb-connection and graph-index as a time-bound decision with expires, and ask the responsible architect to name a successor so path_back can be written (F-008, F-009, F-010); proposed due 2026-11-27, owner Digital workplace team with Dermot O'Brien as responsible architect.
    - Obtain an attested target-state position for node-pp-prod (DN-009) from the responsible architect (F-008).
    - Catalogue, or onboard, teams, entra, graph-index and sbb-kb-connection, or show they are already catalogued, so novelty can be derived from refs (TR-002, novelty driver).
