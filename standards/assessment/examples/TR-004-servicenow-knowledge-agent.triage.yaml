# TR-004 supersedes TR-003. It is the re-triage of SD-002 at version 0.1.0, unchanged, before its
# design review (trigger new-design), made by an independent assessing agent from the specification
# and the responsible architect's corrected attestation.
#
# Why a new record: the responsible architect corrected two positions after TR-003, in his words:
# "We are using M365 Copilot, so I guess we could say it is in use today, but what's not in the
# target state is adding to the graph items that originate from outside the Microsoft ecosystem.
# The target state has a separate knowledge store using a mixture of semantic and graph RAG (i.e.,
# vector and graph RAG)." So graph-index is target, limited to content that originates in Microsoft
# 365, and sbb-kb-connection, which adds ServiceNow articles to Microsoft Graph as external items, is
# not-target; the successor for both is the target state's separate enterprise knowledge store. The
# answers and the tier derive the same as TR-003 (AT3), but TR-003's novelty note and its reassess
# field rested on positions that no longer hold, and are rewritten here. TR-004 also records the
# requester's method update that an exception for a not-target block is approved only after
# escalation to the organisation's exception authority, and adds the evidence that makes due.
#
# Where each answer comes from (unchanged from TR-003, derived again):
#   subject_kind, uses_model: elements.svc-kb-agent has an ai facet and no agent facet (no tools).
#   reach: elements.svc-kb-agent.ai.grounding (sources data-kb-index, retrieval hybrid,
#     access_control caller-permission-trimmed), no agent facet, so no tools. An indexed enterprise
#     source retrieved per user is read, not knowledge.
#   agency: no tools, so none.
#   untrusted_content: connectors.c-agent-index.carries_untrusted_content true,
#     elements.svc-kb-agent.ai.input_trust mixed; no tool writes or reaches outside.
#   data_classification: data[].classification, highest confidential.
#   personal_data: data.data-transcripts.personal true; drivers.obligations.obl-privacy (staff, as employer).
#   exposure: design.exposure staff.
#   effect_on_people: drivers.obligations.obl-ai-transparency (limited risk, Article 50 only);
#     drivers.non_goals rule out any decision about people.
#   novelty: target_state (sbb-kb-connection at not-target; graph-index used beyond its permitted
#     use); elements teams, entra,
#     graph-index and sbb-kb-connection have no ref; no element has assessed_by.
#   reversibility: decisions[].reversibility, all two-way-door.
schema: triage/0.1.0

triage:
  id: TR-004
  subject:
    name: ServiceNow knowledge agent in Teams
    design: SD-002
    description: A Copilot Studio agent in Teams answering staff questions from ServiceNow knowledge articles indexed into the Microsoft Graph semantic index by the servicenowkb3 Copilot connector connection, with no tools. Triaged at design version 0.1.0 for a design review before acceptance.
    owner: Digital workplace team
  date: "2026-10-28"
  by: Architecture agent (independent assessor, role agent), from the specification; target-state positions attested by Dermot O'Brien, responsible architect, with his correction to graph-index and sbb-kb-connection after TR-003
  supersedes: TR-003

answers:
  subject_kind: ai-solution
  uses_model: true
  reach: read
  agency: none
  untrusted_content: read-only
  data_classification: confidential
  personal_data: staff
  exposure: staff
  effect_on_people: none-or-transparency
  novelty: new-to-landscape
  reversibility: two-way-door

target_state:
  - element: sbb-kb-connection
    position: not-target
    successor: The target state's separate enterprise knowledge store, which uses a mixture of vector (semantic) and graph retrieval
    attested_by: { name: Dermot O'Brien, role: Responsible architect for the target architecture of this test case }
    date: "2026-10-28"
    note: >-
      Corrected after TR-003. The architect's position is that adding to Microsoft Graph items that originate outside the Microsoft ecosystem is "not in the target state", and this connection is exactly that pattern. Recorded as not-target with the enterprise knowledge store as successor. The knowledge store is not an element of the specification and has no catalogue entry, so it is named here only as the architect described it. The design's source document (design.source) calls servicenowkb3 an existing tenant-wide connection; whether it already runs is for the architect and the owner to confirm, and does not change the position.
  - element: graph-index
    position: target
    permitted_use: Content that originates in the Microsoft 365 ecosystem; not items from outside it
    successor: For this design's use (ServiceNow articles), the target state's separate enterprise knowledge store, which uses a mixture of vector (semantic) and graph retrieval
    attested_by: { name: Dermot O'Brien, role: Responsible architect for the target architecture of this test case }
    date: "2026-10-28"
    note: >-
      Corrected after TR-003, which recorded it as not-target. It is in use today for Microsoft Search and Microsoft 365 Copilot ("We are using M365 Copilot"), and is target for content from the Microsoft 365 ecosystem. The design uses it for ServiceNow articles, which is beyond its permitted use and so a departure under CORE-TGT-01.
  - element: sbb-copilot-studio
    ref: SBB-044
    position: target
    attested_by: { name: Dermot O'Brien, role: Responsible architect for the target architecture of this test case }
    date: "2026-10-28"
    note: Carried over from TR-003, unchanged.
  - element: teams
    position: target
    attested_by: { name: Dermot O'Brien, role: Responsible architect for the target architecture of this test case }
    date: "2026-10-28"
    note: Carried over from TR-003, unchanged. Attested target but has no catalogue ref in the specification.
  - element: entra
    position: target
    attested_by: { name: Dermot O'Brien, role: Responsible architect for the target architecture of this test case }
    date: "2026-10-28"
    note: Carried over from TR-003, unchanged. Attested target but has no catalogue ref in the specification.
  - element: node-pp-prod
    ref: DN-009
    position: target
    permitted_use: Limited to what is needed to run Copilot Studio agents
    attested_by: { name: Dermot O'Brien, role: Responsible architect for the target architecture of this test case }
    date: "2026-10-28"
    note: Carried over from TR-003, unchanged. Whether the design's use stays within the permitted use is judged by the assessment under CORE-TGT-01.

result:
  type: ai-solution
  tier: AT3
  drivers:
    - driver: reach-and-agency
      tier: AT2
      note: Reach read, agency none (section 3.1), from elements.svc-kb-agent.ai.grounding and the absence of an agent facet. input_trust is mixed, not untrusted, and the untrusted article text is internal, so the external row does not apply. Same as TR-003.
    - driver: data
      tier: AT2
      note: Highest data[].classification is confidential; personal data is staff questions in data-transcripts, not customers' or special-category data. Same as TR-003.
    - driver: exposure
      tier: AT1
      note: design.exposure is staff. Same as TR-003.
    - driver: untrusted-content
      tier: AT2
      note: Present (connectors.c-agent-index.carries_untrusted_content true; input_trust mixed) in a session with no tool that writes or reaches outside. Same as TR-003.
    - driver: effect-on-people
      tier: AT1
      note: drivers.obligations.obl-ai-transparency, limited risk with the Article 50 duty only; no decision about people (drivers.non_goals). Same as TR-003.
    - driver: novelty
      tier: AT3
      note: >-
        Same tier as TR-003, with the reasoning rewritten for the corrected positions. sbb-kb-connection is attested at not-target, which section 3.4 reads as new to the landscape: AT3 on that alone, whether or not it gets a catalogue ref and whether or not a departure is approved. graph-index is target but used beyond its permitted use (ServiceNow content, not Microsoft 365 content), which is a departure: AT2 on its own. Separately, four elements of kind sbb or technology have no ref (teams, entra, graph-index, sbb-kb-connection), which the rule also reads as new to the landscape; for teams, entra and graph-index this conflicts with their target attestation and is reported, but it does not change the tier. Only sbb-copilot-studio (SBB-044) and node-pp-prod (DN-009) are catalogued. No element names an admitting assessment in assessed_by, so Copilot Studio counts as a platform not yet assessed and nothing is inherited. A component new to the landscape needs its onboarding assessment first (section 7); this is recorded as a condition rather than a stop, because this is a design review and the architect's preferred route removes the component.
    - driver: reversibility
      tier: AT1
      note: Every decision is a two-way door. Same as TR-003.
  plan:
    depth: review
    lenses: [core, ai-solution]
    independent_assessor: true
    approver: The architecture board or its delegate, with the service owner (Digital workplace team)
    evidence:
      - "Due at this design review: a threat model for design version 0.1.0 (CORE-SEC-04)"
      - "Due at this design review: a cost model (CORE-CST-01)"
      - "Due at this design review: for sbb-kb-connection (not-target), either a design that grounds the agent on the enterprise knowledge store instead, or an accepted decision with a departure approved by the organisation's exception authority after escalation, with the escalation recorded (CORE-TGT-05, as the requester's method update states it)"
      - "Due at this design review: for graph-index, a design that keeps it within its permitted use (Microsoft 365 content only), or an accepted decision with a departure for using it for ServiceNow content (CORE-TGT-01)"
      - "Due at this design review: the results of the checks on servicenowkb3 that d-reuse-kb3 names as its condition, if the connection is kept"
      - "Due at this design review: catalogue entries, or onboarding assessments, for every sbb and technology with no ref (teams, entra, graph-index, and sbb-kb-connection if it is kept)"
      - "Due at this design review: the plans for every gating eval, an injection test of article content and a load test, judged as plans"
      - "Due at production entry: eval reports for every gating eval, against the version being released"
      - "Due at production entry: injection test results for untrusted article content, and a red-team report"
      - "Due at production entry: a load test against sc-latency"
      - "Due at production entry: the outcomes of the full security assessment and the privacy impact assessment"
    handovers: [cybersecurity, privacy]
    staged_rollout: false
    reassess: >-
      Every six months and on a change (AT3). A change to the grounding path, the connection's scope or query string, the model, the audience, the knowledge bases in scope (HR bases above all) or a first tool is re-triaged before it is made. What would move the tier: grounding the agent on the enterprise knowledge store instead of the connection and the Microsoft 365 index, with that store catalogued at target and teams, entra and graph-index given their catalogue refs, would bring novelty to AT1 and the tier to AT2 (reach, data and untrusted content each give AT2). An approved departure for the not-target connection does not lower novelty: it is still new to the landscape, so the tier stays AT3. An assessed platform element with assessed_by would let the subject inherit controls but would not lower the tier. Adding any tool would raise reach and agency.
