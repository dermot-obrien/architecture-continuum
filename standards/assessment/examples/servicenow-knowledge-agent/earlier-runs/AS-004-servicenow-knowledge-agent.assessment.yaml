  - id: F-027
    criterion: CORE-DEC-03
    result: met
    type: observation
    statement: Met as the rule is written, because the design is proposed. Both open considerations must be resolved by accepted decisions before it is accepted.
    evidence: [design.status, considerations.cn-kb-scope, considerations.cn-hr-bases]
    status: resolved
  - id: F-028
    criterion: CORE-DEC-04
    tool_result: met
    result: met
    statement: Every accepted decision has reversibility; all are two-way doors, which is plausible for configured platform choices.
    evidence: [decisions.reversibility]
    status: resolved
  - id: F-029
    criterion: CORE-DEC-05
    result: met
