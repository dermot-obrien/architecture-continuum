    severity: minor
    statement: Both constraints name a source. The one assumption, about 2,000 questions a working day across 9,000 staff, has none, yet the cost cap and the latency scenario rest on it.
    evidence: [drivers.constraints, drivers.assumptions.asm-volume, operations.cost, scenarios.sc-latency]
    recommendation: Give the volume assumption its source, such as service desk contact data or portal search logs.
