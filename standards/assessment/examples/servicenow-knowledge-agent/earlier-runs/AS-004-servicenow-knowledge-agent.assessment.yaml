    evidence: [decisions]
    status: resolved

  # Interfaces and contracts
  - id: F-030
    criterion: CORE-INT-01
    result: not-met
    type: gap
    severity: major
    statement: All six connectors cross the design's boundary (each has an actor, an external system or a technology at one end) and none names a contract, even the channel or the vendor's published interface and version.
    evidence: [connectors.c-staff-teams, connectors.c-teams-agent, connectors.c-agent-index, connectors.c-connection-servicenow, connectors.c-connection-index, connectors.c-staff-portal]
    recommendation: Name each connector's contract, for example the Microsoft Graph search API version and the ServiceNow table API version.
    disposition: { action: fix-design, owner: Digital workplace team }
    status: open
  - id: F-031
    criterion: CORE-INT-02
    tool_result: met
    result: met
    statement: No connector joins two different bounded contexts of the design, so no context-map relationship is needed.
    evidence: [connectors, elements.part_of]
    status: resolved
  - id: F-032
    criterion: CORE-INT-03
    result: met
    statement: The coupling to a connection shared with other Microsoft 365 uses is deliberate, named in d-reuse-kb3 and cn-kb-scope.
    evidence: [decisions.d-reuse-kb3, considerations.cn-kb-scope]
    status: resolved

  # Data
  - id: F-033
    criterion: CORE-DAT-01
    tool_result: met
    result: partly-met
    type: gap
    severity: major
