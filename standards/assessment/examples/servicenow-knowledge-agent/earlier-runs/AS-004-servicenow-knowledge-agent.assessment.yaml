    evidence: [data.data-kb-articles, data.data-kb-index, data.data-transcripts]
    status: resolved
  - id: F-035
    criterion: CORE-DAT-03
    result: met
    statement: The index has one owner and one writer, the connection, through the owner's external items interface.
    evidence: [data.data-kb-index.owner, connectors.c-connection-index]
    status: resolved

  # Security architecture
  - id: F-036
    criterion: CORE-SEC-01
    result: met
    statement: Three trust zones, and every element other than the actor is in one.
    evidence: [trust_zones, elements.trust_zone]
    status: resolved
  - id: F-037
    criterion: CORE-SEC-02
    result: met
    statement: Every connector that crosses a trust zone is authenticated and authorised.
    evidence: [connectors.c-teams-agent, connectors.c-agent-index, connectors.c-connection-servicenow]
    status: resolved
  - id: F-038
    criterion: CORE-SEC-03
    tool_result: not-met
    result: not-met
    type: gap
    severity: major
    statement: Three connectors with an actor or an external system at one end do not say whether they carry untrusted content. Staff questions arrive through the Teams connector, and the connection pulls the article text from ServiceNow that the design itself treats as untrusted further along.
    evidence: [connectors.c-staff-teams, connectors.c-staff-portal, connectors.c-connection-servicenow, connectors.c-agent-index.carries_untrusted_content]
    recommendation: State carries_untrusted_content on all three, and say where article text and staff input are contained before the model acts on them.
    disposition: { action: fix-design, owner: Digital workplace team }
    status: open
  - id: F-039
    criterion: CORE-SEC-04
    result: not-met
    type: gap
    severity: major
    statement: There is no threat model for this version; the only evidence is the design research. The cybersecurity hand-over is recorded in this assessment.
    evidence: [evidence, evidence.ev-design-research]
    recommendation: Produce a threat model for version 0.1.0, or for the redesigned version, covering permission fidelity from ServiceNow into the grounding store and injection through article text.
    disposition: { action: fix-design, owner: "Digital workplace team, with a security architect" }
    status: open
  - id: F-040
    criterion: CORE-SEC-05
    result: met
    type: sensitivity-point
    statement: The connection runs as its own machine integration user with a custom read role, and the agent retrieves as the asking user. Every answer's confidentiality turns on one thing, that ServiceNow user criteria survive the copy into the index, including the email-based identity mapping. A redesign onto the knowledge store must keep this property.
    evidence: [connectors.c-connection-servicenow.authentication, connectors.c-agent-index.authentication, data.data-kb-index.lineage, risks.rsk-overshare]
    status: resolved

