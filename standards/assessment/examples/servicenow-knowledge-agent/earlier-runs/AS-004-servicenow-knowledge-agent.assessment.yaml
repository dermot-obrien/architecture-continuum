  # Quality attributes
  - id: F-020
    criterion: CORE-QA-01
    tool_result: met
    result: met
    statement: Three quality scenarios, one failure and one misuse scenario, each with stimulus, response, a measurable response measure and importance.
    evidence: [scenarios]
    status: resolved
  - id: F-021
    criterion: CORE-QA-02
    tool_result: partly-met
    result: partly-met
    type: gap
    severity: major
    statement: Reliability, security and performance are covered. No scenario covers maintainability or cost, and neither omission is said to be deliberate, although the design caps spend at 600 USD a month and depends on a platform model that changes without a release.
    evidence: [scenarios.quality_attribute, operations.cost.budget, elements.svc-kb-agent.ai.model.version_pinned]
    recommendation: Add a cost scenario (credit use against the cap at peak) and a maintainability scenario (a platform model change, caught by the gating evals), or say why each is left out.
    disposition: { action: fix-design, owner: Digital workplace team }
    status: open
  - id: F-022
    criterion: CORE-QA-03
    tool_result: met
    result: met
    statement: Every scenario has importance and difficulty, and the high-importance, high-difficulty ones (correct answers, restricted HR article) have design responses in the gating evals.
    evidence: [scenarios.sc-correct, scenarios.sc-restricted, fitness_functions]
    status: resolved
  - id: F-023
    criterion: CORE-QA-04
    tool_result: met
    result: partly-met
    type: gap
    severity: major
    statement: The one failure scenario covers the crawl stopping. The design depends on others it cannot control, Copilot Studio and its model, Microsoft 365 search and Entra ID, and their failure is covered only by a sentence in the fallback, with no scenario or measure.
    evidence: [scenarios.sc-crawl-stops, elements.svc-kb-agent.ai.fallback, operations.recovery]
    recommendation: Add a failure scenario for the agent platform or the search being unavailable, with a measure for how fast staff are sent to the portal search.
    disposition: { action: fix-design, owner: Digital workplace team }
    status: open
  - id: F-024
    criterion: CORE-QA-05
    result: partly-met
    type: trade-off-point
    severity: major
    elements: [sbb-kb-connection, svc-kb-agent]
    statement: The precision and recall trade-off is set in the eval ceilings, but not recorded as a decision. The trade between index-speed answers and permission freshness, where a knowledge base permission change can take up to a day to reach answers, is stated in the grounding but decided nowhere.
    evidence: [elements.svc-kb-agent.ai.grounding.freshness, elements.svc-kb-agent.ai.evals.eval-answer-or-abstain, decisions]
    recommendation: Record both trade-offs as decisions, naming the qualities each moves and who accepts the permission lag.
    disposition: { action: record-decision, owner: Digital workplace team }
    status: open

  # Decisions and open questions
  - id: F-025
    criterion: CORE-DEC-01
    tool_result: met
    result: met
    statement: Both accepted decisions have chosen, alternatives and rationale. Decisions the design leaves unrecorded are taken under the criteria that ask for them (F-024, F-054, F-073).
    evidence: [decisions.d-copilot-connector, decisions.d-auth-microsoft]
