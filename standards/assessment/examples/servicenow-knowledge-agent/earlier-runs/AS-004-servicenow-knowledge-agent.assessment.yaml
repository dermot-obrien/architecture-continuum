  - id: F-056
    criterion: AIS-MOD-03
    tool_result: met
    result: met
    statement: The fallback is to say so and link to the portal search, which is enough for a staff knowledge assistant.
    evidence: [elements.svc-kb-agent.ai.fallback]
    status: resolved
  - id: F-057
    criterion: AIS-EVAL-01
    result: met
    statement: Six evals, each with a metric and a threshold.
    evidence: [elements.svc-kb-agent.ai.evals]
    status: resolved
  - id: F-058
    criterion: AIS-EVAL-02
    result: met
    statement: Four offline evals gate release.
    evidence: [elements.svc-kb-agent.ai.evals.gating]
    status: resolved
  - id: F-059
    criterion: AIS-EVAL-03
    result: partly-met
    type: gap
    severity: major
    elements: [svc-kb-agent]
    statement: The evals cover correct answers, declining, citations and permission leakage. None tests instructions planted in article text, which the design names as untrusted input; the adversarial prompts come from users. Latency has no planned test, and the staff population (languages, roles) is not described in any test set.
    evidence: [elements.svc-kb-agent.ai.evals, connectors.c-agent-index.carries_untrusted_content, scenarios.sc-latency]
    recommendation: Plan an injection eval with instructions planted in test articles, a load test against the latency scenario, and say which staff groups the test set represents.
    disposition: { action: fix-design, owner: Digital workplace team }
    status: open
  - id: F-060
    criterion: AIS-EVAL-04
    result: not-met
    type: gap
    severity: major
    elements: [svc-kb-agent]
    statement: The correctness eval uses an AI judge that is not calibrated against human labels, so its 90 percent pass rate is not yet evidence. The source document plans calibration on at least 50 labelled cases, but the specification does not.
    evidence: [elements.svc-kb-agent.ai.evals.eval-correctness.judge_calibrated, design.source]
    recommendation: Calibrate the judge on human-labelled cases and record it in the specification.
    disposition: { action: fix-design, owner: Digital workplace team }
    status: open
  - id: F-061
    criterion: AIS-EVAL-05
    tool_result: not-met
    result: not-met
    type: gap
    severity: major
    elements: [svc-kb-agent]
    statement: The agent takes mixed-trust input, so a red-team eval or report is required. Neither is planned; the report itself is due at production entry, but the plan is due now.
    evidence: [elements.svc-kb-agent.ai.input_trust, elements.svc-kb-agent.ai.evals, evidence]
    recommendation: Add a red-team eval to the plan, against the OWASP LLM risks that apply.
    disposition: { action: fix-design, owner: Digital workplace team }
    status: open
  - id: F-062
    criterion: AIS-EVAL-06
    tool_result: met
    result: met
    type: non-risk
    statement: Both classifying evals name their positive class and set separate ceilings on each error, and the ceilings lean the way the costs do (a wrong answer capped at 2 percent, a missed answer at 20 percent, F0.5 reported).
    evidence: [elements.svc-kb-agent.ai.evals.eval-answer-or-abstain, elements.svc-kb-agent.ai.evals.eval-citation]
    status: resolved
  - id: F-063
    criterion: AIS-EVAL-07
    tool_result: met
    result: met
    statement: The answer-or-abstain eval has answering as its positive class, and 40 percent of its 400 questions (160) are unanswerable or out of scope. Whether 160 is enough to prove the 2 percent ceiling is F-065.
    evidence: [elements.svc-kb-agent.ai.evals.eval-answer-or-abstain]
    status: resolved
  - id: F-064
    criterion: AIS-EVAL-08
    result: met
    statement: A gating, zero-tolerance leakage eval as test users with different access.
    evidence: [elements.svc-kb-agent.ai.evals.eval-permission-leakage]
    status: resolved
  - id: F-065
    criterion: AIS-EVAL-09
    result: partly-met
    type: gap
    severity: minor
    elements: [svc-kb-agent]
    statement: The 300 clean leakage probes bound the rate below about 1 percent, which is enough. The 160 unanswerable questions show a wrong-answer rate below 2 percent only if almost none fail, and no eval reports an interval.
    evidence: [elements.svc-kb-agent.ai.evals.sample_size, elements.svc-kb-agent.ai.evals.eval-answer-or-abstain.errors]
    recommendation: Size the unanswerable questions for the ceiling (about 190 with none failing, more if some may), and report intervals.
    disposition: { action: fix-design, owner: Digital workplace team }
    status: open
  - id: F-066
    criterion: AIS-DATA-01
    result: met
    statement: The grounding source resolves to a named, owned, classified data set used for grounding.
    evidence: [elements.svc-kb-agent.ai.grounding.sources, data.data-kb-index]
    status: resolved
  - id: F-067
    criterion: AIS-DATA-02
    result: met
    type: observation
    statement: Retrieval of confidential content is trimmed to the caller. In this design the trimming is done by the Microsoft 365 index; a redesign onto the enterprise knowledge store must trim to the caller in the same way, or it fails this blocker criterion.
    evidence: [elements.svc-kb-agent.ai.grounding.access_control, data.data-kb-index.classification]
    status: resolved
  - id: F-068
    criterion: AIS-DATA-03
    tool_result: met
    result: met
    statement: Drift monitoring and freshness are stated, and crawl freshness is a continuous fitness function.
    evidence: [elements.svc-kb-agent.ai.drift_monitoring, elements.svc-kb-agent.ai.grounding.freshness, fitness_functions.ff-crawl-freshness]
    status: resolved
  - id: F-069
    criterion: AIS-DATA-04
    result: met
    statement: No data is used for training or fine-tuning. The eval sets are built from internal articles and answers written by knowledge base owners.
    evidence: [data.used_for_ai, elements.svc-kb-agent.ai.evals]
    status: resolved
  - id: F-070
    criterion: AIS-IO-01
    result: met
    statement: The agent declares mixed input trust, and does not claim trusted input while receiving untrusted article text.
    evidence: [elements.svc-kb-agent.ai.input_trust, connectors.c-agent-index.carries_untrusted_content]
    status: resolved
  - id: F-071
    criterion: AIS-IO-02
    result: met
    statement: Output is displayed text with citation links, and is validated.
    evidence: [elements.svc-kb-agent.ai.output_handling]
    status: resolved
  - id: F-072
    criterion: AIS-IO-03
    result: met
    type: non-risk
    statement: Confidentiality rests on retrieval as the user, not on the system prompt.
    evidence: [connectors.c-agent-index.authorisation, elements.svc-kb-agent.ai.grounding.access_control]
    status: resolved
  - id: F-073
    criterion: AIS-OPS-01
    result: not-met
    type: gap
    severity: major
    elements: [svc-kb-agent]
    statement: A monthly budget is set but no timeout, and no decision accepts the platform's own call limits, which the rule's managed-platform alternative requires.
    evidence: [elements.svc-kb-agent.ai.limits, decisions]
    recommendation: Record a decision accepting the platform's limits, with the budget cap.
    disposition: { action: record-decision, owner: Digital workplace team }
    status: open
  - id: F-074
    criterion: AIS-OPS-02
    tool_result: partly-met
    result: partly-met
    type: gap
    severity: minor
    elements: [svc-kb-agent]
    statement: Traces are on and the platform's telemetry is named, but the design does not show that it records prompts, outputs and cost per call, and no decision records the gap from the GenAI conventions.
