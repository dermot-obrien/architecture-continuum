    evidence: [elements.svc-kb-agent.deployed_to, data.data-kb-articles.owner, data.data-kb-index.owner, data.data-transcripts.owner]
    status: resolved
  - id: F-017
    criterion: CORE-STR-05
    result: met
    statement: Every local reference resolves and every id is unique, checked across elements, connectors, scenarios, data, fitness functions, decisions, considerations, risks, SLOs and evidence.
    evidence: [connectors, scenarios.steps, elements, fitness_functions, decisions, operations.slos, evidence]
    status: resolved
  - id: F-018
    criterion: CORE-STR-06
    result: met
