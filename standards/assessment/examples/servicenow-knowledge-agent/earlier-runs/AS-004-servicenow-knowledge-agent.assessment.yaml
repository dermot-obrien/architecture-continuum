  # Target state
  - id: F-008
    criterion: CORE-TGT-01
    result: not-met
    type: gap
    severity: major
    elements: [sbb-kb-connection, graph-index]
    statement: >-
      Positions read from TR-004, none inferred. Nothing is retired. Two elements need a decision with departure set and have none: sbb-kb-connection is attested not-target, and graph-index is target only for content that originates in Microsoft 365, while the design uses it for ServiceNow articles, which is beyond its permitted use. No decision has departure set (d-copilot-connector and d-reuse-kb3 affect the connection but record no departure; no decision affects graph-index). node-pp-prod is limited to what is needed to run Copilot Studio agents; the design deploys only the agent there, with its transcripts in Dataverse, which this reviewer judges within the limit. Teams, Entra ID and Copilot Studio are attested target. The architect names one successor for both departures: the target state's separate enterprise knowledge store, using vector and graph retrieval. The design's source document describes servicenowkb3 as an existing tenant-wide connection, which the architect and the owner should reconcile with the attestation; the attestation is applied as given.
    evidence: [triage.target_state, decisions.d-copilot-connector, decisions.d-reuse-kb3, elements.svc-kb-agent.ai.grounding.sources, data.data-kb-index, elements.node-pp-prod, data.data-transcripts, design.source]
    recommendation: Ground the agent on the enterprise knowledge store instead of the connection and the Microsoft 365 index, which removes both departures. Only if that cannot wait, record each departure as a decision, with the escalation that the not-target connection needs (see F-012).
    disposition: { action: fix-design, owner: "Digital workplace team, with the responsible architect" }
    status: open
  - id: F-009
    criterion: CORE-TGT-02
    tool_result: met
    result: not-met
    type: gap
    severity: major
    elements: [sbb-kb-connection, graph-index]
    statement: The tool half is met only because no decision has departure set, so there is nothing to check. The reviewer half fails. Two departures from the target state have gone unrecorded, the not-target connection and the use of the Microsoft 365 index beyond its permitted use, so there is no expiry and no path back for either.
    evidence: [decisions, triage.target_state]
    recommendation: As F-008. If a departure is kept, make it time-bound with the enterprise knowledge store as its path back.
    disposition: { action: fix-design, owner: "Digital workplace team, with the responsible architect" }
    status: open
  - id: F-010
    criterion: CORE-TGT-03
    result: partly-met
    type: risk
    severity: major
    elements: [sbb-kb-connection, graph-index, svc-kb-agent]
    statement: >-
      The agent, its channel, its sign-in and its platform are where the organisation is heading. The grounding path is not: it copies ServiceNow content into the Microsoft 365 index, the pattern the target state excludes, and makes the agent depend on that copy, which adds to what the target means to replace with the enterprise knowledge store. The alternatives in d-copilot-connector do not include the knowledge store.
    evidence: [decisions.d-copilot-connector.alternatives, connectors.c-connection-index, connectors.c-agent-index, triage.target_state]
    recommendation: Redesign the grounding onto the enterprise knowledge store and record the choice as a decision with the Microsoft options as alternatives set aside.
    disposition: { action: fix-design, owner: Digital workplace team }
    status: open
  - id: F-011
    criterion: CORE-TGT-04
    result: not-met
    type: gap
    severity: minor
    elements: [sbb-kb-connection]
    statement: The design argues that the connector is the best grounding route (d-copilot-connector) but never asks whether the target's enterprise knowledge store can serve, or whether the target should change. If the author believes the knowledge store cannot meet this need yet, that is a question to raise, not to work around.
    evidence: [decisions.d-copilot-connector.rationale, considerations, triage.target_state]
    recommendation: Raise a consideration with the responsible architect, whether the knowledge store can ground this agent now, and if not, when.
    disposition: { action: raise-consideration, owner: Digital workplace team }
    status: open
  - id: F-012
    criterion: CORE-TGT-05
    result: not-met
    type: gap
    severity: blocker
    elements: [sbb-kb-connection]
    statement: >-
      sbb-kb-connection is attested not-target and no decision with status accepted and departure set names it, so the rule fails. Applied with the escalation requirement as the requester stated it in a method update: an exception for a not-target block is approved only by the organisation's exception authority (for example the architecture board or its delegate) after escalation, and approved_by must name that authority with the escalation recorded. Core 0.4.0 still names the responsible architect as approver; the result is the same under either reading, because no departure exists. The responsible architect has said he is not inclined to endorse, "as we have defined a target state and those two are not it", so nothing has been escalated or approved. graph-index is target, so this criterion does not apply to it; its use beyond its permitted use is F-008.
    evidence: [triage.target_state, decisions, decisions.d-copilot-connector, decisions.d-reuse-kb3]
    recommendation: Change the design so the agent is grounded on the enterprise knowledge store, which is the target state's path and removes the connection. The only other route is an exception escalated to the exception authority and approved by it, recorded as an accepted decision with a departure naming that authority.
    disposition: { action: fix-design, owner: "Digital workplace team, with the responsible architect" }
    status: open

  # Structure
  - id: F-013
    criterion: CORE-STR-01
    result: met
    statement: The building blocks are at container grain. Copilot Studio is a catalogued SBB (SBB-044), so its grain is the catalogue's.
