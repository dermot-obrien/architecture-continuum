  - id: F-026
    criterion: CORE-DEC-02
    result: partly-met
    type: gap
    severity: major
    statement: Two open questions are named (knowledge base scope, HR bases). Two more are not. Whether Graph connector knowledge is returned under Authenticate with Microsoft is left "to confirm in the tenant" inside an accepted decision. And whether the target's enterprise knowledge store can ground the agent is not asked (F-011).
    evidence: [considerations, decisions.d-auth-microsoft.rationale, design.source]
    recommendation: Raise both as considerations, and reopen d-auth-microsoft until the tenant check is done.
